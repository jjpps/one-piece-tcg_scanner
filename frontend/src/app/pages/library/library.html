<br />
<hr />

<div class="container">
  <ng-container *ngIf="libraryState$ | async as state">

    <div class="row gx-1 gy-2 align-items-center">
      <div class="col">
        <div class="input-group">
          <select
            class="form-select col-2"
            aria-label="Search by"
            [(ngModel)]="searchBy"
            name="searchBy"
            style="min-width: 140px; max-width: 160px;"
          >
            <option value="code">Code</option>
            <option value="name">Name</option>
          </select>
          <select
            class="form-select col-2"
            aria-label="Filter by color"
            [(ngModel)]="selectedColor"
            name="selectedColor"
            (change)="onColorChange(selectedColor)"
            style="min-width: 140px; max-width: 180px;"
          >
            <option value="">Todas as cores</option>
            <option *ngFor="let color of (cardColors$ | async) || []" [value]="color">{{ color }}</option>
          </select>
          <input
            class="form-control rounded-0"
            type="text"
            placeholder="Buscar"
            aria-label="Search term"
            [(ngModel)]="searchTerm"
            name="searchTerm"
            (keydown.enter)="search()"
          />
          <button class="btn btn-primary rounded-end" type="button" aria-label="Pesquisar" (click)="search()">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>
    </div>
    <br />
    <!-- Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
      <p *ngIf="state.items.length === 0" class="text-center w-100">
        {{ searchTerm || selectedColor
            ? 'Nenhuma carta encontrada para este filtro.'
            : 'Nenhuma carta na biblioteca.' }}
      </p>
      <div class="col" *ngFor="let card of state.items; trackBy: trackByCode">
        <div class="card h-100 shadow-sm">
          <img
            [src]="card.image_url"
            class="card-img-top"
            [alt]="card.card_name"
            loading="lazy"
            decoding="async"
          />

          <div class="card-body text-center">
            <h6 class="card-title">
              {{ card.card_name }}
            </h6>

            <p class="card-text mb-1"><strong>Código:</strong> {{ card.code }}</p>
            <div
              class="row row-cols-1 row-cols-sm-2 row-cols-md-3 align-items-center g-2 card-actions"
            >
              <div class="col">
                <button type="button" class="btn btn-danger w-100" (click)="removeCard(card.code)">
                  <i class="bi bi-dash"></i>
                </button>
              </div>
              <div class="col">
                <div class="quantity-box">
                  {{ card.quantity }}
                </div>
              </div>
              <div class="col">
                <button type="button" class="btn btn-success w-100" (click)="addCard(card.code)">
                  <i class="bi bi-plus"></i>
                </button>
              </div>
            </div>
            <span
              class="badge text-bg-danger d-flex justify-content-center align-items-center repeat-badge"
              [class.invisible]="card.quantity <= 4"
            >
              Repetidas
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-center align-items-center gap-3 my-4">
      <button
        type="button"
        class="btn btn-outline-secondary"
        [disabled]="page <= 1"
        (click)="prevPage()"
      >
        Anterior
      </button>
      <span>Página {{ page }} ({{ state.total }} carta(s) no total)</span>
      <button
        type="button"
        class="btn btn-outline-secondary"
        [disabled]="!hasNextPage"
        (click)="nextPage()"
      >
        Próxima
      </button>
    </div>
  </ng-container>
</div>
