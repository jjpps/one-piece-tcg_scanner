<main class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6">
        <div class="h-100 p-5 bg-body-tertiary border rounded-3">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="deckListEditor" class="form-label">Cole a lista de cartas com quantidade e código</label>
              <textarea
                id="deckListEditor"
                class="form-control json-editor"
                rows="16"
                placeholder="Exemplo:&#10;2 EB03-021&#10;1 FR02-001&#10;3 OP01-123"
                [(ngModel)]="listText"
                name="listText"
              ></textarea>
            </div>

            <div class="mb-3 d-flex justify-content-center flex-wrap gap-2">
              <button
                type="submit"
                class="btn btn-outline-primary"
                [disabled]="!listText || loading"
              >
                {{ loading ? 'Enviando...' : 'Enviar lista' }}
              </button>
            </div>

            <div *ngIf="jsonError" class="alert alert-danger" role="alert">{{ jsonError }}</div>
            <div *ngIf="jsonResult" class="alert alert-success" role="alert">{{ jsonResult }}</div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
