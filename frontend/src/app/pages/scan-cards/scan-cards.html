<main class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6">
        <div class="h-100 p-5 bg-body-tertiary border rounded-3">
          <app-upload-cards *ngIf="showCardsUpload" 
                             (uploadComplete)="proceedToReview()">
          </app-upload-cards>

          <app-cards-review *ngIf="showCardsReview"></app-cards-review>

          <!-- example reset button so you can toggle back while developing -->
          <button *ngIf="showCardsReview" (click)="reset()" class="btn btn-link mt-3">
            Voltar para upload
          </button>
          <br />
          <app-processing-bar></app-processing-bar>
        </div>
      </div>
    </div>
  </div>
</main>
