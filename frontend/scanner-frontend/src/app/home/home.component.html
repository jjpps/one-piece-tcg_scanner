<main class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-12 col-md-4">
        <div class="h-100 p-5 bg-body-tertiary border rounded-3">
          <h2>Scan Cards</h2>
          <br/>
          <button type="button" class="btn btn-outline-dark" routerLink="/ScanCards">Scan Cards</button>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="h-100 p-5 bg-body-tertiary border rounded-3">
          <h2>Check Library</h2>
          <br/>
          <button type="button" class="btn btn-outline-dark" routerLink="/Library">Check Library</button>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="h-100 p-5 bg-body-tertiary border rounded-3">
          <h2>Check Errors</h2>
          <br/>
          <button type="button" class="btn btn-outline-dark" routerLink="/ScanErrors">Errors on Detection</button>
        </div>
      </div>
      
    </div>
  </div>
</main>
